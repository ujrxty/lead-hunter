<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="'Instrument Serif', 'Times New Roman', serif">
  <defs>
    <!-- Warm near-black background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12100e"/>
      <stop offset="1" stop-color="#0a0908"/>
    </linearGradient>

    <!-- Lime signal glow -->
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#c8ec5c" stop-opacity="0.14"/>
      <stop offset="0.4" stop-color="#c8ec5c" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#c8ec5c" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <!-- Card grid pattern (denser) -->
    <pattern id="micro" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M6 0 L0 0 0 6" fill="none" stroke="#c8ec5c" stroke-opacity="0.10" stroke-width="0.6"/>
    </pattern>

    <!-- Card shadow -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Top status bar -->
  <g font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" letter-spacing="0.15em" fill="#7a736a">
    <text x="72" y="52">SIGNAL TERMINAL · v1.0</text>
    <g transform="translate(1092 44)">
      <circle cx="6" cy="4" r="4" fill="#c8ec5c"/>
      <text x="18" y="8" fill="#c8ec5c">CONNECTED</text>
    </g>
  </g>

  <!-- Divider under status bar -->
  <line x1="72" y1="72" x2="1208" y2="72" stroke="#2a251f" stroke-width="1"/>

  <!-- ================= LEFT SIDE ================= -->
  <!-- Logo crosshair -->
  <g transform="translate(72 138)">
    <rect x="0" y="0" width="60" height="60" rx="10" fill="#1a1612" stroke="#2a251f"/>
    <g transform="translate(30 30)">
      <circle r="18" fill="none" stroke="#c8ec5c" stroke-width="1" opacity="0.9"/>
      <line x1="0" y1="-26" x2="0" y2="-20" stroke="#c8ec5c" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="0" y1="20" x2="0" y2="26" stroke="#c8ec5c" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="-26" y1="0" x2="-20" y2="0" stroke="#c8ec5c" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="20" y1="0" x2="26" y2="0" stroke="#c8ec5c" stroke-width="1.6" stroke-linecap="round"/>
      <circle r="8" fill="none" stroke="#c8ec5c" stroke-width="0.8" opacity="0.4"/>
      <circle r="3" fill="#c8ec5c"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="152" y="176" fill="#f2ede4" font-size="42" letter-spacing="-0.01em">Lead Hunter</text>
  <text x="152" y="200" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" letter-spacing="0.2em" fill="#7a736a">
    UPWORK · INTELLIGENCE · TERMINAL
  </text>

  <!-- Headline -->
  <g transform="translate(72 262)">
    <text fill="#f2ede4" font-size="66" letter-spacing="-0.02em">Hunt the</text>
    <text y="72" fill="#c8ec5c" font-size="66" letter-spacing="-0.02em" font-style="italic">real clients.</text>
  </g>

  <!-- Subtitle -->
  <text x="72" y="424" fill="#a89f92" font-size="20" letter-spacing="-0.005em" font-family="'Instrument Serif', serif">
    Scrape, score, enrich, and draft proposals.
  </text>
  <text x="72" y="452" fill="#a89f92" font-size="20" letter-spacing="-0.005em" font-family="'Instrument Serif', serif">
    All on your machine. AI-powered end-to-end.
  </text>

  <!-- Feature bullets (mono) -->
  <g font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" letter-spacing="0.08em" fill="#8a8175">
    <g transform="translate(72 512)">
      <text fill="#c8ec5c">›</text>
      <text x="18">CLOUDFLARE-BYPASSING SCRAPER</text>
    </g>
    <g transform="translate(72 536)">
      <text fill="#c8ec5c">›</text>
      <text x="18">200-ENTRY COMPANY DETECTOR</text>
    </g>
    <g transform="translate(72 560)">
      <text fill="#c8ec5c">›</text>
      <text x="18">GROQ / LLAMA 3.3 PROPOSAL DRAFTS</text>
    </g>
  </g>

  <!-- ================= RIGHT SIDE ================= -->
  <!-- Mock terminal / job card cluster -->
  <g transform="translate(700 130)">

    <!-- Card 1 (top, hot lead) -->
    <g filter="url(#soft)">
      <rect x="0" y="0" width="510" height="120" rx="10" fill="#171310"/>
      <rect x="0" y="0" width="510" height="120" rx="10" fill="url(#micro)"/>
      <rect x="0" y="0" width="4" height="120" fill="#c8ec5c"/>
      <!-- score pill -->
      <rect x="20" y="18" width="46" height="20" rx="4" fill="#c8ec5c" fill-opacity="0.14" stroke="#c8ec5c" stroke-opacity="0.4"/>
      <text x="26" y="33" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#c8ec5c">92%</text>
      <!-- company chip -->
      <rect x="76" y="18" width="120" height="20" rx="4" fill="#c8ec5c" fill-opacity="0.10" stroke="#c8ec5c" stroke-opacity="0.3"/>
      <text x="86" y="33" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c8ec5c">BrickDistrict</text>
      <!-- time chip -->
      <rect x="206" y="18" width="70" height="20" rx="4" fill="#3a80c8" fill-opacity="0.12" stroke="#3a80c8" stroke-opacity="0.3"/>
      <text x="216" y="33" font-family="'JetBrains Mono', monospace" font-size="11" fill="#78b0e0">14m ago</text>
      <!-- title -->
      <text x="20" y="66" font-family="'Instrument Serif', serif" font-size="18" fill="#f2ede4">Build a LEGO Inventory Management System</text>
      <!-- meta -->
      <g transform="translate(20 92)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a8175">
        <text fill="#e0b060">★ 4.98</text>
        <text x="60">$5K+ spent</text>
        <text x="150">US</text>
        <text x="200">$85/hr</text>
      </g>
    </g>

    <!-- Card 2 (middle) -->
    <g transform="translate(0 140)" filter="url(#soft)">
      <rect x="0" y="0" width="510" height="100" rx="10" fill="#171310"/>
      <rect x="20" y="18" width="46" height="20" rx="4" fill="#e0b060" fill-opacity="0.14" stroke="#e0b060" stroke-opacity="0.3"/>
      <text x="26" y="33" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#e0b060">76%</text>
      <rect x="76" y="18" width="140" height="20" rx="4" fill="#c8ec5c" fill-opacity="0.10" stroke="#c8ec5c" stroke-opacity="0.3"/>
      <text x="86" y="33" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c8ec5c">Bello Construction</text>
      <text x="20" y="66" font-family="'Instrument Serif', serif" font-size="17" fill="#f2ede4">Python data scraper for regulatory registers</text>
      <g transform="translate(20 88)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a8175">
        <text fill="#e0b060">★ 4.9</text>
        <text x="60">$2K+ spent</text>
        <text x="150">CA</text>
        <text x="200">Fixed $600</text>
      </g>
    </g>

    <!-- Card 3 (bottom) -->
    <g transform="translate(0 260)" filter="url(#soft)">
      <rect x="0" y="0" width="510" height="100" rx="10" fill="#171310"/>
      <rect x="20" y="18" width="46" height="20" rx="4" fill="#e0b060" fill-opacity="0.14" stroke="#e0b060" stroke-opacity="0.3"/>
      <text x="26" y="33" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#e0b060">68%</text>
      <rect x="76" y="18" width="118" height="20" rx="4" fill="#c8ec5c" fill-opacity="0.10" stroke="#c8ec5c" stroke-opacity="0.3"/>
      <text x="86" y="33" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c8ec5c">Arise-network</text>
      <text x="20" y="66" font-family="'Instrument Serif', serif" font-size="17" fill="#f2ede4">Cloudflare Pages + D1 evidence database</text>
      <g transform="translate(20 88)" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a8175">
        <text fill="#e0b060">★ 5.0</text>
        <text x="60">$18K+ spent</text>
        <text x="150">UK</text>
        <text x="200">$45-70/hr</text>
      </g>
    </g>

    <!-- Command hint line -->
    <g transform="translate(0 384)" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5a5148">
      <text>› scraped 108 jobs · flagged 3 real companies · drafted 3 proposals</text>
    </g>
  </g>

  <!-- Footer credit -->
  <g transform="translate(72 596)" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.15em" fill="#5a5148">
    <text>github.com/ujrxty/lead-hunter</text>
  </g>
  <g transform="translate(1208 596)" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.15em" fill="#5a5148" text-anchor="end">
    <text>MIT · PYTHON · NEXT.JS · GROQ</text>
  </g>
</svg>
